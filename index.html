<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantinho da Elsa – Menu Digital</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0b0b;--card:#181818;--line:#2c2c2c;--tx:#fff;--mu:#a9a9a9;--y:#FFC914;--r:#E8141C;--g:#2DB84B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;max-width:720px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#000;border-bottom:2px solid var(--y)}
.logo{width:46px;height:46px;object-fit:contain}
header h1{font-size:16px;flex:1;line-height:1.1}header small{display:block;color:var(--y);font-weight:400;font-size:11px;letter-spacing:1px}
.cb{background:var(--r);color:#fff;border:0;border-radius:20px;padding:8px 12px;font-weight:700;cursor:pointer}
main{padding:14px}
.hero{border-radius:20px;padding:28px 18px;text-align:center;background:radial-gradient(circle at 50% 0,#3a2a00,#000 70%);border:2px solid var(--y)}
.hero .logo{width:150px;height:150px;margin:0 auto 8px;display:block}
.hero h2{font-size:28px;color:var(--y);font-family:Georgia,serif;font-style:italic}
.hero p{color:var(--mu);margin:6px 0 16px}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--y);color:#000;text-decoration:none}
.btn.r{background:var(--r);color:#fff}.btn.g{background:var(--g);color:#000}.btn.o{background:none;border:2px solid var(--y);color:var(--y)}
.btn.w{width:100%;text-align:center;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;text-align:center;cursor:pointer;font-weight:700}
.sec img{width:100%;height:110px;object-fit:cover;display:block}.sec b{display:block;padding:10px 6px}.sec:active{transform:scale(.97)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:#fff;border-radius:20px;padding:8px 14px;cursor:pointer;font-weight:600}
.chip.on{background:var(--y);color:#000;border-color:var(--y)}
h3{margin:6px 0 10px;color:var(--y)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:120px;overflow:hidden;display:grid;place-items:center;font-size:52px;transition:transform .2s}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.it:hover .pic img{transform:scale(1.1)}.it:hover .pic{transform:none}
.it .b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.it .n{font-weight:700;font-size:14px}.it .d{font-size:12px;color:var(--mu);flex:1}
.it .p{color:var(--y);font-weight:800}
.q{display:flex;align-items:center;justify-content:space-between;gap:6px}
.q button{width:32px;height:32px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:18px;font-weight:800;cursor:pointer}
.q button.pl{background:var(--g);color:#000}
.q b{min-width:18px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;background:#000;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;font:inherit}
.seg{display:flex;gap:8px}.seg .chip{flex:1;text-align:center}
.tot{font-size:20px;font-weight:800;color:var(--y)}
.iban{background:#000;border:1px dashed var(--y);border-radius:10px;padding:10px;font-family:monospace;word-break:break-all;color:var(--y)}
.mu{color:var(--mu);font-size:13px}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--r),var(--y));margin-top:4px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--y)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;background:#000;border-top:2px solid var(--y);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--y)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--g);color:#000;padding:10px 16px;border-radius:20px;font-weight:700;z-index:9}
</style>
</head>

function catV(id){var c=C.filter(function(x){return x.id==id})[0];

function fee(){return form.mode=="Entrega"?FEE:0}
function disc(){return 0}
